# Windows onedir freeze and Inno Setup installer (Phase 3.1 / 3.2).
# Triggers: workflow_dispatch (tester zip + setup exe) and workflow_call
# (Release upload). Not on push. Tag wiring lives in release.yml (not this file).
#
# Publish:
#   workflow_call inputs are unset on workflow_dispatch. A later step copies
#   inputs.release_tag into RELEASE_TAG (empty when missing). Non-empty:
#   gh release upload of the zip and setup exe. Empty: 5-day Actions artifacts.
#   Never both.

name: Windows freeze

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "If set, upload the zip and setup exe to this GitHub Release tag"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  freeze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-freeze.txt

      - name: Install freeze dependencies
        run: python -m pip install -r requirements-freeze.txt

      - name: PyInstaller onedir
        run: pyinstaller packaging/cleave.spec

      - name: Stage sidecars
        run: python scripts/windows_stage_freeze.py --dist dist/cleave

      - name: Headless smoke
        env:
          CLEAVE_DATA: ${{ runner.temp }}/cleave-smoke-data
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          import cleave
          from cleave.separate import STEM_SPLIT_MISSING_FROZEN

          exe = Path("dist") / "cleave" / "cleave.exe"
          if not exe.is_file():
              raise SystemExit(f"missing {exe}")

          expected_version = f"cleave {cleave.__version__}"
          version = subprocess.run(
              [str(exe), "--version"],
              capture_output=True,
              text=True,
              check=False,
          )
          version_text = (version.stdout or "").strip()
          if version.returncode != 0:
              raise SystemExit(
                  f"--version exited {version.returncode}: {version_text}\n"
                  f"{version.stderr}"
              )
          if version_text != expected_version:
              raise SystemExit(
                  f"--version expected {expected_version!r}, got {version_text!r}"
              )

          help_run = subprocess.run(
              [str(exe), "--help"],
              capture_output=True,
              text=True,
              check=False,
          )
          help_text = (help_run.stdout or "") + (help_run.stderr or "")
          if help_run.returncode != 0:
              raise SystemExit(f"--help exited {help_run.returncode}:\n{help_text}")
          for command in ("separate", "play", "render", "backup", "restore"):
              if command not in help_text:
                  raise SystemExit(f"--help missing {command!r}:\n{help_text}")

          dummy = Path(os.environ["CLEAVE_DATA"]) / "smoke.wav"
          dummy.parent.mkdir(parents=True, exist_ok=True)
          dummy.write_bytes(b"audio")
          separate = subprocess.run(
              [str(exe), "separate", str(dummy)],
              capture_output=True,
              text=True,
              check=False,
          )
          separate_text = (separate.stdout or "") + (separate.stderr or "")
          if STEM_SPLIT_MISSING_FROZEN not in separate_text:
              raise SystemExit(
                  "separate missing frozen stem-split message:\n"
                  f"{separate_text}"
              )
          if "Traceback" in separate_text or "ModuleNotFoundError" in separate_text:
              raise SystemExit(f"separate printed a traceback:\n{separate_text}")
          if separate.returncode == 0:
              raise SystemExit("separate should exit non-zero")

          print("smoke ok")

      - name: Zip onedir
        shell: python
        run: |
          import os
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, ".")
          import cleave

          dist = Path("dist") / "cleave"
          zip_name = f"cleave-{cleave.__version__}-windows-x64.zip"
          zip_path = Path(zip_name)
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in dist.rglob("*"):
                  if not path.is_file():
                      continue
                  arcname = Path("cleave") / path.relative_to(dist)
                  zf.write(path, arcname.as_posix())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ZIP_NAME={zip_name}\n")
          print(f"wrote {zip_path} ({zip_path.stat().st_size} bytes)")

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          import cleave

          version = cleave.__version__
          iscc = Path(r"C:\Program Files (x86)\Inno Setup 6\ISCC.exe")
          if not iscc.is_file():
              raise SystemExit(f"missing {iscc}")

          iss = Path("packaging") / "windows" / "cleave.iss"
          cmd = [str(iscc), f"/DAppVersion={version}", str(iss)]
          print("running", cmd)
          built = subprocess.run(cmd, check=False)
          if built.returncode != 0:
              raise SystemExit(f"iscc exited {built.returncode}")

          setup_name = f"cleave-{version}-windows-x64-setup.exe"
          setup_path = Path(setup_name)
          if not setup_path.is_file():
              raise SystemExit(f"missing {setup_path}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SETUP_NAME={setup_name}\n")
          print(f"wrote {setup_path} ({setup_path.stat().st_size} bytes)")

      - name: Headless installer smoke
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, ".")
          import cleave

          setup_name = os.environ["SETUP_NAME"]
          setup = Path(setup_name)
          if not setup.is_file():
              raise SystemExit(f"missing {setup}")

          install_dir = Path(os.environ["RUNNER_TEMP"]) / "cleave-install"
          install = subprocess.run(
              [
                  str(setup),
                  "/VERYSILENT",
                  "/SUPPRESSMSGBOXES",
                  "/NORESTART",
                  "/CURRENTUSER",
                  f"/DIR={install_dir}",
                  "/TASKS=",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if install.returncode != 0:
              raise SystemExit(
                  f"setup exited {install.returncode}:\n"
                  f"{install.stdout}\n{install.stderr}"
              )

          exe = install_dir / "cleave.exe"
          if not exe.is_file():
              raise SystemExit(f"missing installed {exe}")

          expected_version = f"cleave {cleave.__version__}"
          version = subprocess.run(
              [str(exe), "--version"],
              capture_output=True,
              text=True,
              check=False,
          )
          version_text = (version.stdout or "").strip()
          if version.returncode != 0:
              raise SystemExit(
                  f"installed --version exited {version.returncode}: "
                  f"{version_text}\n{version.stderr}"
              )
          if version_text != expected_version:
              raise SystemExit(
                  f"installed --version expected {expected_version!r}, "
                  f"got {version_text!r}"
              )

          unins = install_dir / "unins000.exe"
          if not unins.is_file():
              raise SystemExit(f"missing {unins}")
          uninstall = subprocess.run(
              [
                  str(unins),
                  "/VERYSILENT",
                  "/SUPPRESSMSGBOXES",
                  "/NORESTART",
              ],
              capture_output=True,
              text=True,
              check=False,
          )
          if uninstall.returncode != 0:
              raise SystemExit(
                  f"uninstall exited {uninstall.returncode}:\n"
                  f"{uninstall.stdout}\n{uninstall.stderr}"
              )

          deadline = time.time() + 60
          leftover_files = []
          while True:
              if not install_dir.exists():
                  leftover_files = []
                  break
              leftover_files = [p for p in install_dir.rglob("*") if p.is_file()]
              if not leftover_files or time.time() >= deadline:
                  break
              time.sleep(0.5)
          if leftover_files:
              raise SystemExit(
                  "install dir still has files after uninstall: "
                  + ", ".join(str(p) for p in leftover_files[:20])
              )
          print("installer smoke ok")

      - name: Resolve publish target
        # workflow_call exposes inputs.release_tag; workflow_dispatch does not.
        # Missing input -> empty RELEASE_TAG -> artifact, not gh release upload.
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        run: echo "RELEASE_TAG=${RELEASE_TAG_INPUT}" >> "$GITHUB_ENV"

      - name: Upload zip as workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cleave-windows-x64
          path: ${{ env.ZIP_NAME }}
          retention-days: 5
          if-no-files-found: error

      - name: Upload setup as workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cleave-windows-x64-setup
          path: ${{ env.SETUP_NAME }}
          retention-days: 5
          if-no-files-found: error

      - name: Upload zip to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$ZIP_NAME"

      - name: Upload setup to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$SETUP_NAME"
