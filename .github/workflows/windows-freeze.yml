# Windows onedir freeze (Phase 3.1).
# Triggers: workflow_dispatch (tester zip) and workflow_call (Release upload).
# Not on push. Tag wiring lives in release.yml (not this file).
#
# Publish:
#   workflow_call inputs are unset on workflow_dispatch. A later step copies
#   inputs.release_tag into RELEASE_TAG (empty when missing). Non-empty:
#   gh release upload. Empty: 5-day Actions artifact. Never both.

name: Windows freeze

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: "If set, upload the zip to this GitHub Release tag"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  freeze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-freeze.txt

      - name: Install freeze dependencies
        run: python -m pip install -r requirements-freeze.txt

      - name: PyInstaller onedir
        run: pyinstaller packaging/cleave.spec

      - name: Stage sidecars
        run: python scripts/windows_stage_freeze.py --dist dist/cleave

      - name: Headless smoke
        env:
          CLEAVE_DATA: ${{ runner.temp }}/cleave-smoke-data
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, ".")
          import cleave
          from cleave.separate import STEM_SPLIT_MISSING_FROZEN

          exe = Path("dist") / "cleave" / "cleave.exe"
          if not exe.is_file():
              raise SystemExit(f"missing {exe}")

          expected_version = f"cleave {cleave.__version__}"
          version = subprocess.run(
              [str(exe), "--version"],
              capture_output=True,
              text=True,
              check=False,
          )
          version_text = (version.stdout or "").strip()
          if version.returncode != 0:
              raise SystemExit(
                  f"--version exited {version.returncode}: {version_text}\n"
                  f"{version.stderr}"
              )
          if version_text != expected_version:
              raise SystemExit(
                  f"--version expected {expected_version!r}, got {version_text!r}"
              )

          help_run = subprocess.run(
              [str(exe), "--help"],
              capture_output=True,
              text=True,
              check=False,
          )
          help_text = (help_run.stdout or "") + (help_run.stderr or "")
          if help_run.returncode != 0:
              raise SystemExit(f"--help exited {help_run.returncode}:\n{help_text}")
          for command in ("separate", "play", "render", "backup", "restore"):
              if command not in help_text:
                  raise SystemExit(f"--help missing {command!r}:\n{help_text}")

          dummy = Path(os.environ["CLEAVE_DATA"]) / "smoke.wav"
          dummy.parent.mkdir(parents=True, exist_ok=True)
          dummy.write_bytes(b"audio")
          separate = subprocess.run(
              [str(exe), "separate", str(dummy)],
              capture_output=True,
              text=True,
              check=False,
          )
          separate_text = (separate.stdout or "") + (separate.stderr or "")
          if STEM_SPLIT_MISSING_FROZEN not in separate_text:
              raise SystemExit(
                  "separate missing frozen stem-split message:\n"
                  f"{separate_text}"
              )
          if "Traceback" in separate_text or "ModuleNotFoundError" in separate_text:
              raise SystemExit(f"separate printed a traceback:\n{separate_text}")
          if separate.returncode == 0:
              raise SystemExit("separate should exit non-zero")

          print("smoke ok")

      - name: Zip onedir
        shell: python
        run: |
          import os
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, ".")
          import cleave

          dist = Path("dist") / "cleave"
          zip_name = f"cleave-{cleave.__version__}-windows-x64.zip"
          zip_path = Path(zip_name)
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in dist.rglob("*"):
                  if not path.is_file():
                      continue
                  arcname = Path("cleave") / path.relative_to(dist)
                  zf.write(path, arcname.as_posix())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ZIP_NAME={zip_name}\n")
          print(f"wrote {zip_path} ({zip_path.stat().st_size} bytes)")

      - name: Resolve publish target
        # workflow_call exposes inputs.release_tag; workflow_dispatch does not.
        # Missing input -> empty RELEASE_TAG -> artifact, not gh release upload.
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || '' }}
        run: echo "RELEASE_TAG=${RELEASE_TAG_INPUT}" >> "$GITHUB_ENV"

      - name: Upload zip as workflow artifact
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cleave-windows-x64
          path: ${{ env.ZIP_NAME }}
          retention-days: 5
          if-no-files-found: error

      - name: Upload zip to GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$ZIP_NAME"
